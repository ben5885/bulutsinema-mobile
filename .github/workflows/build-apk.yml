name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Android platform dosyalarını oluştur
        working-directory: bulutsinema_mobile
        run: flutter create . --platforms android --org com.bulutsinema.app

      - name: Kotlin versiyonunu güncelle
        working-directory: bulutsinema_mobile
        run: |
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' android/build.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle

      - name: Ağ güvenlik yapılandırması ekle (HTTP izni)
        working-directory: bulutsinema_mobile
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF
          sed -i 's/android:label="bulutsinema_mobile"/android:label="bulutsinema_mobile"\n        android:networkSecurityConfig="@xml\/network_security_config"/' android/app/src/main/AndroidManifest.xml

      - name: Paketleri indir
        working-directory: bulutsinema_mobile
        run: flutter pub get

      - name: APK derle
        working-directory: bulutsinema_mobile
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: bulutsinema-apk
          path: bulutsinema_mobile/build/app/outputs/flutter-apk/app-release.apk
