name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Android platform dosyalarını oluştur
        working-directory: bulutsinema_mobile
        run: flutter create . --platforms android --org com.bulutsinema.app

      - name: Düz HTTP izni ekle (yerel PC API için)
        working-directory: bulutsinema_mobile
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Paketleri indir
        working-directory: bulutsinema_mobile
        run: flutter pub get

      - name: APK derle
        working-directory: bulutsinema_mobile
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: bulutsinema-apk
          path: bulutsinema_mobile/build/app/outputs/flutter-apk/app-release.apk
